packages:
  - apps/*
  - packages/*
  - infra

# Versiones compartidas: los paquetes las usan con "catalog:".
catalog:
  typescript: ~6.0.3

# pnpm bloquea scripts de instalación por defecto; solo se permiten estos binarios nativos.
allowBuilds:
  esbuild: true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
  # Telemetría de swagger-ui: bloqueada.
  '@scarf/scarf': false
  '@parcel/watcher': true
  argon2: true
  '@prisma/engines': true
  prisma: true

# Parches de seguridad en dependencias transitivas (`pnpm audit`).
overrides:
  # GHSA-7589-6fvf-x4pw (ReDoS), llega por prisma > @prisma/config.
  effect: '^3.22.1'
