# Servicios locales. Los valores por defecto coinciden con apps/api/.env.example
# y se pueden cambiar con un archivo docker/.env (ver docker/.env.example).
name: parqueavecino

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parqueavecino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parqueavecino}
      POSTGRES_DB: ${POSTGRES_DB:-parqueavecino}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      retries: 10

  # S3 local (compatible con la API de S3). Crea el bucket al arrancar.
  # Los archivos son efímeros: se pierden al recrear el contenedor.
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET_UPLOADS:-parqueavecino-uploads}
    ports:
      - '${S3_PORT:-9000}:9090'

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  # Reenvía webhooks de Stripe (modo test) a la API local.
  # Uso: pnpm docker:stripe  (requiere STRIPE_SECRET_KEY en docker/.env)
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ['stripe']
    command: listen --forward-to host.docker.internal:${API_PORT:-3001}/${API_PREFIX:-api}/payments/webhooks/stripe
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres-data:
  redis-data:
